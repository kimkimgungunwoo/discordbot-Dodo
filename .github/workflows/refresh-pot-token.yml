name: Refresh PoToken

on:
  schedule:
    - cron: "0 */10 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PoToken 재생성
        id: gen
        working-directory: scripts/pot-token
        run: |
          npm install --no-audit --no-fund
          node generate.mjs > token.env
          {
            echo "token_line<<EOF"
            grep '^POT_TOKEN=' token.env
            echo "EOF"
            echo "visitor_line<<EOF"
            grep '^POT_VISITOR_DATA=' token.env
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Lightsail .env 갱신 + lavalink에 핫스왑 반영
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: POT_TOKEN_LINE,POT_VISITOR_LINE
          script: |
            cd ~/discordbot
            grep -q '^POT_TOKEN=' .env && sed -i "s|^POT_TOKEN=.*|$POT_TOKEN_LINE|" .env || echo "$POT_TOKEN_LINE" >> .env
            grep -q '^POT_VISITOR_DATA=' .env && sed -i "s|^POT_VISITOR_DATA=.*|$POT_VISITOR_LINE|" .env || echo "$POT_VISITOR_LINE" >> .env
            LAVALINK_PW=$(grep '^LAVALINK_PASSWORD=' .env | cut -d= -f2-)
            POT_TOKEN_VAL="${POT_TOKEN_LINE#POT_TOKEN=}"
            POT_VISITOR_VAL="${POT_VISITOR_LINE#POT_VISITOR_DATA=}"
            docker compose -f docker-compose.prod.yml exec -T lavalink curl -sS -f -X POST "http://localhost:2333/youtube" \
              -H "Authorization: $LAVALINK_PW" -H "Content-Type: application/json" \
              -d "{\"poToken\":\"$POT_TOKEN_VAL\",\"visitorData\":\"$POT_VISITOR_VAL\"}"
        env:
          POT_TOKEN_LINE: ${{ steps.gen.outputs.token_line }}
          POT_VISITOR_LINE: ${{ steps.gen.outputs.visitor_line }}
