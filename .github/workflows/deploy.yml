name: Deploy to Lightsail

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      # .env는 서버에 직접 두지 않고 매 배포마다 GitHub Secrets(ENV_FILE, .env 전체 내용)로부터 새로 생성한다.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: ENV_FILE
          script: |
            cd ~/discordbot
            git fetch origin main
            git reset --hard origin/main
            [ -f .env ] && cp .env .env.bak
            printf '%s\n' "$ENV_FILE" > .env
            docker compose -f docker-compose.prod.yml build bot
            docker compose -f docker-compose.prod.yml run --rm --no-deps bot python -m scripts.init_dynamodb
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
