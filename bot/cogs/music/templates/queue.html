<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
{% include "_casual.html" %}
{% include "_music.html" %}
  #card { width:900px; }
  .q-head { padding:18px 24px; }
  .q-head .t { font-family:var(--disp); font-weight:800; font-size:19px; }
  .q-head .s { font-family:var(--disp); font-weight:600; font-size:13px; color:var(--muted); margin-top:3px; }
</style>
</head>
<body>
{% import "_music.html" as m %}
<div id="card">
  <div class="q-head">
    <div class="t">🎵 음악 대기열</div>
    <div class="s">대기 중 {{ upcoming|length + remaining }}곡</div>
  </div>
  <div class="rule"></div>
  {{ m.now_playing(current) }}
  {{ m.up_list(upcoming, remaining) }}
</div>
</body>
</html>
