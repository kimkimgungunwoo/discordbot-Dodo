<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
{% include "_casual.html" %}
{% include "_music.html" %}
  #card { width:900px; }
  .pl-head { padding:20px 24px; display:flex; align-items:center; gap:16px; }
  .pl-cover {
    width:76px; height:76px; border-radius:12px; object-fit:cover; background:var(--card-2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:30px;
  }
  .pl-info { flex:1; min-width:0; }
  .pl-title { font-family:var(--disp); font-weight:800; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-sub { font-family:var(--disp); font-weight:600; font-size:13px; color:var(--muted); margin-top:4px; }
  .pl-bar { height:7px; border-radius:999px; background:var(--card-2); margin-top:9px; overflow:hidden; }
  .pl-bar i { display:block; height:100%; background:var(--grape); border-radius:999px; }
</style>
</head>
<body>
{% import "_music.html" as m %}
<div id="card">
  {% set done = played + (1 if current else 0) %}
  {% set pct = (done / meta.total * 100) if meta.total else 0 %}
  <div class="pl-head">
    <img class="pl-cover" src="{{ meta.thumbnail }}" onerror="this.style.visibility='hidden'" alt="">
    <div class="pl-info">
      <div class="pl-title">📀 {{ meta.title }}</div>
      <div class="pl-sub">{{ done }} / {{ meta.total }}곡 재생됨</div>
      <div class="pl-bar"><i style="width:{{ pct }}%"></i></div>
    </div>
  </div>
  <div class="rule"></div>
  {{ m.now_playing(current) }}
  {{ m.up_list(upcoming, remaining) }}
</div>
</body>
</html>
