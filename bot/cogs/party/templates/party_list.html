<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
{% include "_casual.html" %}
  #card { width:920px; }
  .pt-head { padding:20px 24px; }
  .pt-head .t { font-family:var(--disp); font-weight:800; font-size:20px; }
  .pt-head .s { font-family:var(--disp); font-weight:600; font-size:13px; color:var(--muted); margin-top:4px; }
  .pt-row { display:flex; align-items:center; gap:18px; padding:18px 24px; border-top:2px solid var(--line); }
  .pt-idx {
    width:40px; height:40px; border-radius:12px; flex-shrink:0; background:var(--card-2); color:var(--ink-dim);
    display:flex; align-items:center; justify-content:center; font-family:var(--disp); font-weight:800; font-size:17px;
  }
  .pt-body { flex:1; min-width:0; }
  .pt-title { font-family:var(--disp); font-weight:800; font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pt-meta { display:flex; gap:16px; margin-top:7px; font-family:var(--disp); font-weight:600; font-size:13.5px; color:var(--muted); }
  .pt-meta b { color:var(--ink-dim); }
  .pt-count {
    flex-shrink:0; font-family:var(--disp); font-weight:800; font-size:15px; color:var(--grape);
    background:#8b7cf61a; border:1px solid #8b7cf650; border-radius:999px; padding:8px 16px; white-space:nowrap;
  }
</style>
</head>
<body>
<div id="card">
  <div class="pt-head">
    <div class="t">👥 파티 목록</div>
    <div class="s">총 {{ rows|length }}개</div>
  </div>
  {% for r in rows %}
  <div class="pt-row">
    <div class="pt-idx">{{ r.index }}</div>
    <div class="pt-body">
      <div class="pt-title">{{ r.title }}</div>
      <div class="pt-meta">
        <span>👑 <b>{{ r.host_name }}</b></span>
        <span>🕐 <b>{{ r.time_str }}</b></span>
      </div>
    </div>
    <div class="pt-count">👥 {{ r.member_count }}명</div>
  </div>
  {% endfor %}
</div>
</body>
</html>
