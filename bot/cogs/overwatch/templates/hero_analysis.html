<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
{% include "_casual.html" %}
{% include "_ow.html" %}
  #card { width:1400px; }
  .hgrid { padding:22px 24px; border-top:2px solid var(--line); }
  .hgrid .sec { display:block; margin-bottom:12px; }
  .hg { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .hc { background:var(--card-2); border-radius:12px; padding:14px 10px; text-align:center; position:relative; }
  .hc .rk { position:absolute; top:8px; left:10px; font-family:var(--disp); font-weight:800; font-size:11px; color:var(--muted); }
  .hc .hci { width:48px; height:48px; border-radius:12px; object-fit:cover; background:#4b4f5a; margin:6px auto 8px; }
  .hc .hcn { font-family:var(--disp); font-weight:800; font-size:14px; }
  .hc .hcs { font-family:var(--disp); font-weight:600; font-size:11px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div id="card">
  <div class="ow-hdr">
    <img class="av" src="{{ p.avatar }}" onerror="this.style.visibility='hidden'" alt="">
    <div><div class="nm">{{ p.name }}</div><div class="tt">플레이시간 기준 상위 {{ p.top_heroes|length }}개 영웅</div></div>
  </div>
  <div class="hgrid">
    <span class="sec">모스트 영웅 TOP {{ p.top_heroes|length }}</span>
    <div class="hg">
      {% for h in p.top_heroes %}
      <div class="hc">
        <span class="rk">#{{ loop.index }}</span>
        <img class="hci" src="{{ h.portrait }}" onerror="this.style.visibility='hidden'" alt="">
        <div class="hcn">{{ h.name }}</div>
        <span class="wrchip {{ 'hi' if h.winrate >= 50 else 'lo' }}">{{ h.winrate }}%</span>
        <div class="hcs">{{ h.hours_played }}시간 · KDA {{ h.kda }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
  {% if ai_comment %}
  <div class="ai"><div class="k">🤖 AI 코멘트</div><div class="t">{{ ai_comment }}</div></div>
  {% endif %}
</div>
</body>
</html>
