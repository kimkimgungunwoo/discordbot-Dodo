<div id="marble-black-preview">
  <style>
    #marble-black-preview{--fx-paper:#ffffff;--fx-ink:#263244;--fx-muted:#747d8b;--fx-line:#d4d9e2;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--fx-ink);width:100%}
    #marble-black-preview *{box-sizing:border-box}
    #marble-black-preview .fx-window{background:var(--fx-paper);border:1px solid var(--fx-line);border-radius:12px;padding:18px}
    #marble-black-preview .fx-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--fx-line);margin-bottom:14px}
    #marble-black-preview h2{font-size:22px;font-weight:800;letter-spacing:-.8px;margin:0}
    #marble-black-preview .fx-preview-label{font-size:12px;color:var(--fx-muted);white-space:nowrap;padding-right:70px}
    #marble-black-preview .fx-tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
    #marble-black-preview button{font:inherit;cursor:pointer;border:1px solid var(--fx-line);border-radius:7px;background:var(--fx-paper);color:var(--fx-ink);padding:9px 12px;font-size:13px;min-height:40px}
    #marble-black-preview .fx-tabs button[aria-pressed="true"]{background:var(--fx-ink);color:var(--fx-paper)}
    #marble-black-preview .fx-layout{display:grid;grid-template-columns:minmax(0,1fr) 206px;gap:18px;align-items:start}
    #marble-black-preview .fx-stage{position:relative;min-width:0;background:#f3f1e7}
    #marble-black-preview .fx-scene{display:block;width:100%;height:auto;touch-action:pan-y}
    #marble-black-preview .fx-aside{display:flex;flex-direction:column;gap:15px;min-width:0}
    #marble-black-preview .fx-kicker{font-size:11px;color:var(--fx-muted);letter-spacing:1px;font-weight:750}
    #marble-black-preview h3{font-size:17px;margin:4px 0 0;font-weight:800;letter-spacing:-.4px}
    #marble-black-preview .fx-detail{margin:0;font-size:13px;line-height:1.65;color:var(--fx-muted)}
    #marble-black-preview .fx-bread{width:128px;height:128px;display:block;margin:0 auto;image-rendering:pixelated}
    #marble-black-preview .fx-colors{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center}
    #marble-black-preview .fx-colors canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;display:block}
    #marble-black-preview .fx-colors span{font-size:11px;color:var(--fx-muted)}
    #marble-black-preview .fx-bread-panel{padding-top:14px;border-top:1px solid var(--fx-line)}
    #marble-black-preview .fx-status{font-size:12px;min-height:38px;line-height:1.6;color:var(--fx-muted);margin:0}
    #marble-black-preview .fx-play{background:#263244;color:#ffffff;border-color:#263244;box-shadow:none;font-weight:800;align-self:start}
    #marble-black-preview .fx-footer{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--fx-line)}
    #marble-black-preview .fx-owner{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fx-muted)}
    #marble-black-preview .fx-owner canvas{width:50px;height:40px;image-rendering:pixelated}
    #marble-black-preview .fx-legend{font-size:11px;color:var(--fx-muted);text-align:right;line-height:1.6}
    @media(max-width:620px){#marble-black-preview .fx-window{padding:10px}#marble-black-preview .fx-layout{grid-template-columns:minmax(0,1fr)}#marble-black-preview .fx-aside{display:flex;flex-direction:column;gap:12px}#marble-black-preview .fx-bread-panel{grid-column:1/-1;display:grid;grid-template-columns:100px minmax(0,1fr);align-items:center;gap:12px}#marble-black-preview .fx-bread-panel .fx-kicker{grid-column:1/-1}#marble-black-preview .fx-bread{width:96px;height:96px}#marble-black-preview .fx-tabs button{flex:1 1 44%;min-height:44px;padding:8px 5px;font-size:12px}#marble-black-preview h2{font-size:19px}#marble-black-preview .fx-preview-label{padding-right:0;font-size:11px}#marble-black-preview .fx-header{align-items:flex-start}#marble-black-preview .fx-owner{gap:3px}#marble-black-preview .fx-footer{gap:5px}}

      }else if(mode==='goblin'){
        for(let i=-2;i<=2;i++){const a={x:c.x+i*u*.8,y:c.y+Math.sin(k*6+i)*u*.2};ctx.fillStyle='#43dbc3';ctx.beginPath();ctx.ellipse(a.x,a.y,u*.12,u*.2,-.4,0,Math.PI*2);ctx.fill();ring(a,u*(.2+((k+i+2)%1)*.2),'#a7fff0')}text('−2     −1      0      +1     +2',c.x,c.y+u*.8,Math.max(12,u*.25),'#183d3c');
      }else if(mode==='redistribution'||mode==='leech'){
        for(let seat=1;seat<4;seat++){if(mode==='leech'&&seat>1)continue;const a=point([0,12,21,30][seat]);const dest=mode==='leech'?p:c;ctx.setLineDash(mode==='leech'?[4,4]:[]);line(a,dest,mode==='leech'?'#a43255':'#c49d4e',3);ctx.setLineDash([]);for(let i=0;i<6;i++){const v=(k*2+i/6)%1;const pos=mode==='redistribution'&&k>.5?{x:lerp(c.x,a.x,v),y:lerp(c.y,a.y,v)}:{x:lerp(a.x,dest.x,v),y:lerp(a.y,dest.y,v)};ctx.fillStyle=mode==='leech'?'#e86f83':'#ffe092';ctx.fillRect(pos.x-3,pos.y-3,6,6)}}rune(mode==='leech'?p:c,u*.5,k,'#dfb461');
      }else if(mode==='mind_control'){
        rune(c,u*.6,k,'#ad84ef');for(let seat=1;seat<4;seat++){const a=point([0,12,21,30][seat]);path([{x:c.x,y:c.y-u*.5},{x:a.x,y:a.y-u*1.4},{x:a.x,y:a.y-u*.35}],'#9460d4',2);ring(a,u*.36,'#dbc0ff')}
      }else if(mode==='dirge'||mode==='silent'){
        const origin=mode==='dirge'?point(0):c;for(let i=0;i<4;i++){const v=(k+i*.23)%1;ctx.globalAlpha=fade*(1-v);ring(origin,u*(.4+v*8),mode==='dirge'?'#554265':'#242c37',4)}if(mode==='silent'){line({x:c.x-u,y:c.y-u},{x:c.x+u,y:c.y+u},'#d0d3df',4);line({x:c.x+u,y:c.y-u},{x:c.x-u,y:c.y+u},'#d0d3df',4)}
      }else if(mode==='shaco'){
        for(let i=0;i<5;i++)path([{x:c.x+(i-2)*u*.3,y:c.y-u},{x:c.x+(i-2)*u*.2-u*.15,y:c.y},{x:c.x+(i-2)*u*.35,y:c.y+u}],'#a0b8d8',2);const a=point(18);pixel(birdSprites[ownerSeat],lerp(c.x,a.x,k),lerp(c.y,a.y,k),u*.9);rune(a,u*.5,-k*2,'#a48bda');
      }else if(mode==='adamant'){
        const v=[];for(let i=0;i<=6;i++){const a=i*Math.PI/3;v.push({x:c.x+Math.cos(a)*u*1.1,y:c.y+Math.sin(a)*u*1.2})}path(v,'#f8d682',4);rune(c,u*1.35,k*.3,'#bf9449');pixel(birdSprites[ownerSeat],c.x,c.y+u*.4,u*1.3);for(let i=0;i<12;i++){const a=i*2.4,r=u*(1.4+k*.8);ctx.fillStyle='#e6c475';ctx.fillRect(c.x+Math.cos(a)*r,c.y+Math.sin(a)*r,4,4)}
      }else if(mode==='landmark_takeover'){
        ctx.fillStyle='#f4ead0';ctx.fillRect(c.x-u*.6,c.y-u*.2,u*1.2,u);ctx.fillStyle=colors[ownerSeat];ctx.fillRect(c.x-u*.55,c.y-u*.1,u*1.1,u*.2);path([{x:c.x-u*.6,y:c.y-u*.3},{x:c.x-u*.7,y:c.y-u*.9},{x:c.x-u*.25,y:c.y-u*.65},{x:c.x,y:c.y-u*1.1},{x:c.x+u*.25,y:c.y-u*.65},{x:c.x+u*.7,y:c.y-u*.9},{x:c.x+u*.6,y:c.y-u*.3},{x:c.x-u*.6,y:c.y-u*.3}],'#e9bd55',4);rune(c,u*1.45,-k,'#f4dba1');
      }else if(mode==='unfair_trade'){
        for(let i=0;i<2;i++){const a=k*Math.PI*2+i*Math.PI,x=c.x+Math.cos(a)*u*1.5,y=c.y+Math.sin(a)*u*.65;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(a)*.3);ctx.fillStyle='#fff1ce';ctx.fillRect(-u*.35,-u*.5,u*.7,u);ctx.fillStyle=colors[i];ctx.fillRect(-u*.25,-u*.35,u*.5,u*.15);ctx.fillRect(-u*.25,0,u*.5,2);ctx.restore()}ring(c,u*1.75,'#ddb877');
      }else if(mode==='copernicus'){
        ctx.save();ctx.translate(c.x,c.y);ctx.rotate(k*Math.PI);ctx.scale(1,.45);ring({x:0,y:0},u*1.6,'#e8e4c9',3);ctx.restore();
      }else if(mode==='pacemaker'){
        const pts=[];for(let i=0;i<=80;i++){const x=c.x-u*2+i*u*.05,v=(i/80+k)%1;const y=c.y+(v>.42&&v<.55?Math.sin((v-.42)/.13*Math.PI*2)*u*.7:0);pts.push({x,y})}path(pts,'#b63548',3);
      }
      ctx.restore();
    }
    function draw(){
      const measured=Math.max(280,canvas.getBoundingClientRect().width),dpr=Math.min(devicePixelRatio||1,2);size=measured;
      if(canvas.width!==Math.round(size*dpr)){canvas.width=Math.round(size*dpr);canvas.height=Math.round((size+72)*dpr);}
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,size,size+72);ctx.translate(0,36);const u=size/10,t=progress,active=running||started>0;
      const inverted=mode==='copernicus'?(active?clamp((t-.47)/.12):1):0;
      const impactT=mode==='guillotine'&&active?clamp((t-.59)/.12):1;
      const shake=mode==='guillotine'&&active&&t>.59&&t<.71?Math.sin((t-.59)*210)*6*(1-impactT)*settings.impact:0;
      ctx.save();ctx.translate(shake,Math.abs(shake)*.4);board(inverted,mode==='guillotine');
      const positions=mode==='guillotine'?[2,7,21,30]:[0,12,21,30];previewTiles=positions;hiddenSeats.clear();
      if(mode==='bread'){
        const consumed=active&&t>.61;
        breadTiles.forEach((tile,i)=>{if(i===0&&consumed)return;const p=point(tile),scale=active?clamp((t-i*.025)/.22):1;if(!scale)return;pixel(breadSprites[0],p.x,p.y,u*.53*scale);});
        if(active){const k=clamp((t-.25)/.35),a=point(2),b=point(3);positions[0]=k>=1?3:2;const p={x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k)-Math.sin(k*Math.PI)*u*.2};pixel(birdSprites[0],p.x,p.y,size*54/900);if(consumed)particles(point(3),clamp((t-.61)/.35),12,'#edc66e');}
        baseCenter('헨젤과 그레텔',consumed?'빵조각 1 / 6':'빵조각 0 / 6');
      }else if(mode==='copernicus')baseCenter('수입과 지출, 반전','P1의 도도새 · 소유 지역');
      else if(mode==='pacemaker')baseCenter('페이스메이커','상대의 라인 체류 카운트');
      if(active){const et=Math.max(0,(t-.28)/.72)*2.2;if(mode==='collector'&&t>.28&&et>.65)hiddenSeats.add((ownerSeat+1)%4);if(mode==='devour'&&t>.28){hiddenSeats.add(ownerSeat);if(et>.75)hiddenSeats.add((ownerSeat+1)%4)}}
      for(let seat=0;seat<4;seat++){
        if(hiddenSeats.has(seat))continue;
        if(mode==='bread'&&active&&seat===0)continue;const p=point(positions[seat]);
        const hit=mode==='guillotine'&&active&&t>.61&&seat<2;ctx.save();if(hit)ctx.globalAlpha=1-clamp((t-.61)/.12);
        pixel(seat===0&&inverted?bird(colors[0],inverted):birdSprites[seat],p.x,p.y,size*54/900);ctx.restore();
        if(!hit)text(`P${seat+1}`,p.x,p.y+u*.12,Math.max(11,u*.17),colors[seat]);
        if(mode==='pacemaker'&&seat!==ownerSeat){const revealed=!active||t>.31;if(revealed){let count=[0,1,2,0][seat];if(active&&seat===2)count=t>.66?3:t>.5?2:1;tag(`${count}/3`,p,colors[seat],count>=2);}}
      }
      if(mode==='guillotine')guillotine(t,active);
      trademark(t,active);
      if(active){
        const pp=point(positions[ownerSeat]);ctx.save();ctx.shadowColor=colors[ownerSeat];ctx.shadowBlur=14;ring({x:pp.x,y:pp.y-u*.25},u*.58,colors[ownerSeat],3);ctx.restore();
        if(t<.46)caption(`P${ownerSeat+1} · ${names[mode]}`,subtitles[mode],Math.min(clamp(t/.04),clamp((.46-t)/.08)));
      }
      ctx.restore();
      const owner=ownerCanvas.getContext('2d');owner.clearRect(0,0,40,32);owner.drawImage(mode==='copernicus'?bird(colors[0],inverted):birdSprites[0],0,0);
    }
    function select(effect){cancelAnimationFrame(raf);mode=effect;running=false;started=0;progress=1;
      root.querySelectorAll('[data-effect]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.effect===mode)));
      root.querySelector('[data-effect-title]').textContent=names[mode];root.querySelector('[data-effect-detail]').textContent=subtitles[mode];
      root.querySelector('[data-owner-label]').textContent=`P${ownerSeat+1} · ${names[mode]}`;
      root.querySelector('[data-legend]').textContent=mode==='pacemaker'?'본인 제외 · 머리 위 0/3 → 3/3':mode==='guillotine'?'아래 라인 · 본인도 타격 대상':mode==='bread'?'주인 색으로 구분 · 최종 도착 수집':'소유 지역 A1 · C2 · F1';
      status.textContent=mode==='bread'?'빵조각 6개 배치':mode==='pacemaker'?'머리 위 체류 카운트':mode==='guillotine'?'아래 라인 지정 · 집행 대기':'색 반전과 검정 소유색';play.textContent='연출 재생';draw();
    }
    function run(){cancelAnimationFrame(raf);started=performance.now();running=true;progress=0;play.textContent='처음부터 재생';status.textContent=`${names[mode]} · 재생 중`;
      if(matchMedia('(prefers-reduced-motion: reduce)').matches){progress=1;draw();running=false;status.textContent=`${names[mode]} · 완료`;return;}
      const frame=now=>{progress=clamp((now-started)/lengths[mode]);draw();if(progress<1)raf=requestAnimationFrame(frame);else{running=false;status.textContent=`${names[mode]} · 완료`;play.textContent='다시 재생';if(showcase&&queueIndex<queue.length-1){queueIndex++;ownerSeat=queueIndex%4;select(queue[queueIndex]);run();}else if(showcase){showcase=false;status.textContent='전체 공개 완료';}}};raf=requestAnimationFrame(frame);
    }
    root.querySelectorAll('[data-effect]').forEach(b=>b.addEventListener('click',()=>{showcase=false;ownerSeat=0;select(b.dataset.effect)}));play.addEventListener('click',()=>{showcase=false;run()});
    function startQueue(list){queue=list;queueIndex=0;ownerSeat=0;showcase=true;select(queue[0]);run()}
    root.querySelector('.fx-party').addEventListener('click',()=>startQueue(['copernicus','bread','pacemaker','guillotine']));
    root.querySelector('.fx-all').addEventListener('click',()=>startQueue(catalog.map(c=>c[0])));
    const observer=new ResizeObserver(()=>draw());observer.observe(canvas);select(mode);
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:draw});tweak.addSlider(settings,'impact',{label:'단두대 타격감',min:.4,max:1.5,step:.1});}
  })();
  </script>
</div>
