services:
  dodo-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DODO_DB_NAME:-discordbot}
      POSTGRES_USER: ${DODO_DB_USER:-discordbot}
      POSTGRES_PASSWORD: ${DODO_DB_PASSWORD:?DODO_DB_PASSWORD is required}
    volumes:
      - dodo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DODO_DB_USER:-discordbot} -d ${DODO_DB_NAME:-discordbot}"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DODO_DATABASE_URL: postgresql://${DODO_DB_USER:-discordbot}:${DODO_DB_PASSWORD}@dodo-postgres:5432/${DODO_DB_NAME:-discordbot}
    depends_on:
      activity-server:
        condition: service_started
      dodo-postgres:
        condition: service_healthy

  activity-server:
    build:
      context: ./games
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env

  # 정적으로 빌드한 activity-client + Caddy(HTTPS 리버스 프록시, 인증서 자동 발급).
  # dodobirdactivity.kro.kr의 80/443만 외부에 열려있고, bot/activity-server 내부 포트는 노출 안 됨.
  caddy:
    build:
      context: ./games
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - activity-server

volumes:
  caddy_data:
  caddy_config:
  dodo_postgres_data:
