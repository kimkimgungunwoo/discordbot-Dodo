server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      youtube: false   # 내장 소스 대신 아래 youtube-plugin 사용 (OAuth/PO토큰 지원)
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
  plugins:
    # 1.18.2의 TV 클라이언트는 유튜브가 UA를 거부해서 깨짐(upstream #226). 수정 커밋 스냅샷 — 정식 릴리스 나오면 교체.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # 2026-11-23 Lightsail 실측: WEB=SABR 전용, ANDROID_VR=로그인 요구, TV(+OAuth)만 공식 MV 재생 성공.
    # 검색은 MUSIC/WEB이 하고, 재생은 앞에서부터 시도하므로 TV를 재생 클라이언트 중 맨 앞에 둔다.
    clients:
      - MUSIC       # 검색 전용
      - TV          # OAuth를 쓰는 유일한 클라이언트 — 실제 재생 담당
      - WEB
      - ANDROID_VR
    oauth:
      enabled: true
      # 최초엔 비워두고 기동 → 로그(docker compose logs lavalink)에 뜨는 기기 코드로 부계정 인증
      # → 로그에 찍히는 refresh token을 .env(운영은 GitHub ENV_FILE)의 YOUTUBE_OAUTH_REFRESH_TOKEN에 저장 후 재기동.
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: false
    # 2026-06부터 유튜브가 플레이어 스크립트 난독화 방식을 바꿔서 youtube-source의 자체 서명(cipher)
    # 해독이 깨짐(메인테이너 공식 답변: "remote cipher server 써라"). 처음엔 공개 서버
    # (cipher.kikkia.dev)로 우회했는데, 남의 무료 서버라 느려지거나 죽을 수 있어서
    # 같은 docker-compose 안의 yt-cipher 컨테이너로 자가 호스팅함(요청 제한 없음, 오디오는 안 거침).
    remoteCipher:
      url: "http://yt-cipher:8001"
      password: "${YT_CIPHER_TOKEN:}"
      userAgent: "discordbot-dodo"

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
