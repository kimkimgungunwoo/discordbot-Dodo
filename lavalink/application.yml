server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      youtube: false   # 내장 소스 대신 아래 youtube-plugin 사용 (OAuth/PO토큰 지원)
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # 2026-08-30 실측(GET /youtube/stream/{id}?withClient=)으로 재배치 — WEB/ANDROID_VR은
    # 실제 스트림 200 확인, WEBEMBEDDED는 실패, TV는 OAuth 정상인데도 무제한 영상에서마저
    # 실패(플러그인 자체 결함으로 추정, 별도 이슈) — 그래서 TV를 우선순위 맨 뒤로 내림.
    # PoToken(WEB/WEBEMBEDDED 보강용)은 공식 생성 도구(youtube-trusted-session-generator)가
    # deprecated돼 토큰 추출 자체가 안 돼서(2회 재현 실패) 적용 보류 — WEB이 PoToken 없이도
    # 이미 정상 작동해서 급하지 않음. 새 dynamic/remote PoToken 방식이 stable 지원되면 재검토.
    clients:
      - MUSIC       # 검색 전용 (Playback Support 없음)
      - WEB
      - ANDROID_VR
      - WEBEMBEDDED
      - TV          # OAuth를 실제로 쓰는 유일한 클라이언트 — 현재 자체 결함으로 최후순위
    oauth:
      enabled: true
      # 최초엔 비워두고 기동 → 로그(docker compose logs lavalink)에 뜨는 기기 코드 로그인 링크로
      # 부계정 인증 → 로그에 찍히는 refresh token을 .env의 YOUTUBE_OAUTH_REFRESH_TOKEN에 저장 후 재기동.
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: false
    # 2026-06부터 유튜브가 플레이어 스크립트 난독화 방식을 바꿔서 youtube-source의 자체 서명(cipher)
    # 해독이 깨짐(메인테이너 공식 답변: "remote cipher server 써라") — 무료 공개 서버로 우회.
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "discordbot-dodo"

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
