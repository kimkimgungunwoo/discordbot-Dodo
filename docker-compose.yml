services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    # 파일 기반 저장 — 컨테이너를 내려도(down) 데이터 유지. 초기화하려면 ./dynamodb-data 폴더 삭제.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    volumes:
      - ./dynamodb-data:/home/dynamodblocal/data

  # 도도새배구 등 웹 미니게임 — 로컬은 이미지 빌드 없이 node 베이스 이미지 + 볼륨 마운트로 바로 실행.
  # 운영용 games/client/Dockerfile(멀티스테이지 빌드)은 배포 단계에서 별도로 작성.
  activity-client:
    image: node:22-alpine
    working_dir: /app
    environment:
      ACTIVITY_PROXY_TARGET: http://activity-server:3001
    volumes:
      - ./games/client:/app
      - ./games/shared:/shared
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

  activity-server:
    image: node:22-alpine
    working_dir: /app
    environment:
      ACTIVITY_INTERNAL_SECRET: ${ACTIVITY_INTERNAL_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # 봇도 같은 compose 네트워크에서 도커로 뜰 때는 host.docker.internal 대신 서비스명으로 접근.
      BOT_INTERNAL_URL: http://bot:3002
    volumes:
      - ./games/server:/app
      - ./games/shared:/shared
      - /app/node_modules
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"

  # 봇을 컨테이너로 띄울 때용 — .env는 전부 localhost 기준이라 같은 네트워크의 서비스명으로 덮어쓴다.
  bot:
    build: .
    env_file: .env
    environment:
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      ACTIVITY_SERVER_URL: http://activity-server:3001
      BOT_INTERNAL_HOST: 0.0.0.0
    # 이미지는 빌드 시점 스냅샷이라 소스만 고치면 컨테이너 안 코드와 어긋난다 — 소스를 그대로 덮어써서
    # bot/core/bot.py의 기존 핫리로드(watchfiles)가 실제로 동작하게 한다.
    volumes:
      - .:/app
    depends_on:
      - dynamodb-local
      - activity-server
      - activity-client
