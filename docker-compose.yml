services:
  dodo-postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: discordbot
      POSTGRES_USER: discordbot
    entrypoint:
      - sh
      - -c
      - |
        export POSTGRES_PASSWORD="$${DODO_DB_PASSWORD}"
        exec docker-entrypoint.sh postgres
    ports:
      - "5432:5432"
    volumes:
      - dodo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discordbot -d discordbot"]
      interval: 3s
      timeout: 3s
      retries: 20

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    volumes:
      - ./dynamodb-data:/home/dynamodblocal/data

  activity-client:
    image: node:22-alpine
    working_dir: /app
    environment:
      ACTIVITY_PROXY_TARGET: http://activity-server:3001
    volumes:
      - ./games/client:/app
      - ./games/shared:/shared
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

  activity-server:
    image: node:22-alpine
    working_dir: /app
    env_file:
      - .env
    environment:
      BOT_INTERNAL_URL: http://bot:3002
    volumes:
      - ./games/server:/app
      - ./games/shared:/shared
      - /app/node_modules
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"

  bot:
    build: .
    env_file:
      - .env

    environment:
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      ACTIVITY_SERVER_URL: http://activity-server:3001
      BOT_INTERNAL_HOST: 0.0.0.0

    volumes:
      - .:/app

    command:
      - sh
      - -c
      - |
        export DODO_DATABASE_URL="postgresql://$${DODO_DB_USER:-discordbot}:$${DODO_DB_PASSWORD}@dodo-postgres:5432/$${DODO_DB_NAME:-discordbot}"
        exec python -m bot.main

    depends_on:
      dynamodb-local:
        condition: service_started
      activity-server:
        condition: service_started
      activity-client:
        condition: service_started
      dodo-postgres:
        condition: service_healthy

volumes:
  dodo_postgres_data: