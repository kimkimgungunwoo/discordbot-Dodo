services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    # 파일 기반 저장 — 컨테이너를 내려도(down) 데이터 유지. 초기화하려면 ./dynamodb-data 폴더 삭제.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    volumes:
      - ./dynamodb-data:/home/dynamodblocal/data

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    ports:
      - "2333:2333"
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      YOUTUBE_OAUTH_REFRESH_TOKEN: ${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
      YT_CIPHER_TOKEN: ${YT_CIPHER_TOKEN:-}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    depends_on:
      - yt-cipher

  # 유튜브 cipher(서명) 자가 호스팅 — 오디오는 안 거치고 서명 계산만 함, 아주 가벼움.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    environment:
      API_TOKEN: ${YT_CIPHER_TOKEN:-}
