<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>돈 이동 이펙트</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f1e7}canvas{display:block;width:100%;height:100%}</style><canvas aria-label="돈이 빠져나가 상대에게 이동하고 수입 금액이 떠오르는 이펙트"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);
const amount=Math.max(1,Number(new URLSearchParams(location.search).get("amount"))||250),count=Math.min(160,Math.max(1,Math.ceil(amount/25)));
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-(1-x)**3;
function text(str,x,y,color,alpha,scale=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(scale,scale);ctx.font=`900 ${W<600?23:32}px "Apple SD Gothic Neo","Malgun Gothic",sans-serif`;ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#f3f1e7';ctx.strokeText(str,0,0);ctx.fillStyle=color;ctx.fillText(str,0,0);ctx.restore()}
function coin(x,y,r,angle,alpha,spin){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(Math.max(.24,Math.abs(Math.cos(spin))),1);ctx.globalAlpha=alpha;ctx.shadowColor='#b07e2225';ctx.shadowBlur=9;ctx.shadowOffsetY=4;ctx.beginPath();ctx.ellipse(0,0,r,r,0,0,Math.PI*2);ctx.fillStyle='#be8d32';ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.beginPath();ctx.arc(-1,-2,r-1,0,Math.PI*2);ctx.fillStyle='#f0cf72';ctx.fill();ctx.strokeStyle='#775e2b';ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();ctx.arc(-1,-2,r-4,0,Math.PI*2);ctx.strokeStyle='#fff0b5';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#846326';ctx.font=`900 ${r*1.15}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('₩',-1,-1);ctx.restore()}
function ring(x,y,t,color){if(t<0||t>1)return;ctx.save();ctx.globalAlpha=(1-t)*.55;ctx.strokeStyle=color;ctx.lineWidth=2.5*(1-t)+.5;ctx.beginPath();ctx.ellipse(x,y,12+t*42,5+t*16,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function frame(now){ctx.clearRect(0,0,W,H);const u=Math.min(now,2600)/1000,sx=W*.24,sy=H*.62,tx=W*.76,ty=H*.42,size=W<600?10:15,spread=Math.min(120,W*.15),arrive=[];
 for(let i=0;i<count;i++){const delay=.16+(count<2?0:i/(count-1))*.6,t=(u-delay)/1.02;if(t<0||t>1)continue;const p=clamp(t),q=p*p*(3-2*p),x=sx+(tx-sx)*q,y=sy+(ty-sy)*q-Math.sin(Math.PI*p)*(spread+(i%3-1)*12);ctx.save();ctx.globalAlpha=.11*Math.sin(Math.PI*p);ctx.strokeStyle='#bc8b2c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-18,y+7);ctx.lineTo(x-5,y+2);ctx.stroke();ctx.restore();coin(x,y,size+(i%3-1)*2,Math.sin(p*6+i)*.15,Math.min(1,p*8,(1-p)*10),p*5+i*.4)}
 ring(sx,sy,u/.65,'#b66a5b');const loss=clamp(u/.35);if(u<1.1)text('−'+amount.toLocaleString()+'만원',sx,sy-32-ease(loss)*12,'#b66a5b',clamp(u/.12)*clamp((1.1-u)/.3));
 const t=u-1.18;if(t>=0&&t<1.4){ring(tx,ty,t/.8,'#b49346');for(let i=0;i<12;i++){const p=clamp(t/.75),a=i*Math.PI/6,r=8+p*(i%2?32:43);ctx.save();ctx.globalAlpha=(1-p)*.8;ctx.translate(tx+Math.cos(a)*r,ty+Math.sin(a)*r*.7);ctx.rotate(a+p);ctx.fillStyle=i%2?'#e0bd61':'#bd9845';ctx.fillRect(-1.5,-1.5,3,3);ctx.restore()}const a=clamp(t/.14)*clamp((1.4-t)/.35),scale=1+Math.sin(clamp(t/.32)*Math.PI)*.1;text('+'+amount.toLocaleString()+'만원',tx,ty-30-ease(clamp(t/1.1))*22,'#9b792d',a,scale)}
 if(now<2600)requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
